name: CarbonApp platform validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "apps/backend/**"
      - "apps/mobile/**"
      - "scripts/run_band_stability.py"
      - ".github/workflows/platform-mvp.yml"
  push:
    branches: [main]

jobs:
  python-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research package
        run: pip install -e ".[dev,api,tinyml]"
      - name: Run research tests
        run: pytest -q

  spring-boot-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot API
        run: mvn -B -f apps/backend/pom.xml test
