name: Candidate NIR band-window benchmark

on:
  workflow_dispatch:
    inputs:
      outer_splits:
        description: Outer grouped folds
        required: true
        default: "5"
        type: string
      inner_splits:
        description: Inner grouped folds
        required: true
        default: "4"
        type: string
      seed:
        description: Random seed
        required: true
        default: "42"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "src/carbonapp/band_window_benchmark.py"
      - "scripts/run_band_window_benchmark.py"
      - "tests/test_band_window_benchmark.py"
      - "docs/band-window-benchmark.md"
      - ".github/workflows/band-window-benchmark.yml"
      - "data/raw/**"
  push:
    branches: [main]
    paths:
      - "src/carbonapp/band_window_benchmark.py"
      - "scripts/run_band_window_benchmark.py"
      - "tests/test_band_window_benchmark.py"
      - "docs/band-window-benchmark.md"
      - ".github/workflows/band-window-benchmark.yml"
      - "data/raw/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev,api]"
      - name: Run tests
        run: pytest -q
      - name: Run nested grouped-CV benchmark
        run: |
          python scripts/run_band_window_benchmark.py \
            --data "data/raw/[quad]base_nirs_refletancia.csv" \
            --output reports/band-window-benchmark \
            --seed "${{ inputs.seed || '42' }}" \
            --outer-splits "${{ inputs.outer_splits || '5' }}" \
            --inner-splits "${{ inputs.inner_splits || '4' }}"
      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: carbonapp-band-window-benchmark-${{ github.run_number }}
          path: reports/band-window-benchmark/
          if-no-files-found: error
          retention-days: 30
