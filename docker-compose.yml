services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carbonapp
      POSTGRES_USER: carbonapp
      POSTGRES_PASSWORD: carbonapp
    ports: ["5432:5432"]
    volumes: [carbonapp_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U carbonapp -d carbonapp"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/carbonapp
      DATABASE_USERNAME: carbonapp
      DATABASE_PASSWORD: carbonapp
      PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  carbonapp_pgdata:
